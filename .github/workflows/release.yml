name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer versión de package.json
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Comprobar si el tag ya existe
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "El tag v${VERSION} ya existe, se omite el release"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          # - os: macos-latest
          #   platform: macos-arm64
          # - os: windows-latest
          #   platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Renombrar binario con sufijo de plataforma
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv weather.exe "weather-${PLATFORM}.exe"
          else
            mv weather "weather-${PLATFORM}"
          fi

      - name: Subir binario
        uses: actions/upload-artifact@v4
        with:
          name: weather-${{ matrix.platform }}
          path: dist/weather-*
          if-no-files-found: error

  release:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar binarios
        uses: actions/download-artifact@v4
        with:
          pattern: weather-*
          merge-multiple: true
          path: dist

      - name: Crear tag y release
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" dist/weather-* \
            --title "v${VERSION}" \
            --generate-notes
